<div [routerLink]="['/product', product.id]"
     class="border rounded-lg p-4 cursor-pointer hover:shadow-lg transition">
  <img [src]="product.imgUrl" [alt]="product.model" class="w-full h-48 object-contain mb-2" />
  <h3 class="font-bold">{{ product.brand }}</h3>
  <p class="text-gray-600">{{ product.model }}</p>
  <p class="text-lg font-bold mt-2">{{ product.price ? '$' + product.price : '&nbsp;' }}</p>
</div>
